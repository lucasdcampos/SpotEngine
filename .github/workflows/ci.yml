name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SpotEngine.slnx

      - name: Build
        run: dotnet build SpotEngine.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SpotEngine.slnx --configuration Release --no-build --verbosity normal
